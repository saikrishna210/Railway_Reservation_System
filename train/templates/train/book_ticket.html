<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    /* PAGE BACKGROUND */
body {
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
}

/* BOOKING CARD */
.booking-card {
    border-radius: 18px;
    background: pink;
    box-shadow: 0 20px 45px rgba(0,0,0,0.2);
    animation: slideUp 0.9s ease;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.booking-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 30px 60px rgba(0,0,0,0.25);
}
.card.booking-card {
    background: pink !important;
}


/* TITLE */
.booking-card h2 {
    font-weight: bold;
    margin-bottom: 25px;
}

/* LABELS */
.booking-card label {
    font-weight: 600;
    margin-bottom: 6px;
}

/* INPUTS */
.booking-card input {
    padding: 12px;
    border-radius: 10px;
    transition: all 0.3s ease;
}

.booking-card input:focus {
    border-color: #ff9800;
    box-shadow: 0 0 10px rgba(255,152,0,0.6);
}

/* BUTTON */
.confirm-btn {
    background: linear-gradient(45deg, #0d6efd, #0b5ed7);
    border: none;
    padding: 12px 35px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 30px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.confirm-btn:hover {
    transform: scale(1.06);
    box-shadow: 0 10px 25px rgba(13,110,253,0.6);
}

/* ANIMATION */
@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

</style>
<body>
    {% extends 'train/base.html' %}

{% block title %}
Book Ticket
{% endblock %}

{% block content %}
<div class="card p-4 shadow booking-card">
    <h3 class="mb-3">
        Book Ticket – {{ train.train_name }}
    </h3>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Journey Date</label>
            <input type="date" name="journey_date" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Number of Seats</label>
            <input
                type="number" name="number_of_seats" class="form-control" min="1" required>
        </div>

        <button type="submit" class="btn btn-primary confirm-btn">
            Confirm Booking
        </button>
    </form>
</div>
{% endblock %}

</body>
</html>

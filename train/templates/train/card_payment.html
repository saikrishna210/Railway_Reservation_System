<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% extends 'train/base.html' %}

    {% block title %}Card Payment{% endblock %}

    {% block content %}

<style>
body{
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
}

/* PAYMENT CARD */
.payment-card{
    max-width:500px;
    margin:60px auto;
    background:#fff;
    padding:30px;
    border-radius:18px;
    box-shadow:0 20px 40px rgba(0,0,0,0.3);
    animation: slideUp 0.8s ease;
}

.payment-card h3{
    text-align:center;
    margin-bottom:25px;
    font-weight:bold;
}

/* INPUTS */
.payment-card label{
    font-weight:600;
    margin-top:12px;
}

.payment-card input{
    width:100%;
    padding:12px;
    margin-top:5px;
    border-radius:10px;
    border:1px solid #ccc;
    transition:all 0.3s ease;
}

.payment-card input:focus{
    border-color:#ff9800;
    box-shadow:0 0 8px rgba(255,152,0,0.6);
    outline:none;
}

/* BUTTON */
.pay-btn{
    width:100%;
    margin-top:25px;
    padding:14px;
    font-size:16px;
    font-weight:bold;
    border:none;
    border-radius:30px;
    background:linear-gradient(45deg,#198754,#28a745);
    color:#fff;
    transition:transform 0.3s ease, box-shadow 0.3s ease;
}

.pay-btn:hover{
    transform:scale(1.05);
    box-shadow:0 10px 25px rgba(25,135,84,0.6);
}

/* ANIMATION */
@keyframes slideUp{
    from{opacity:0; transform:translateY(30px);}
    to{opacity:1; transform:translateY(0);}
}
</style>

<div class="payment-card">
    <h3>Card Payment</h3>

    <form method="POST">
        {% csrf_token %}

        <label>Card Holder Name</label>
        <input type="text" name="card_name" required>

        <label>Card Number</label>
        <input type="text" name="card_number" maxlength="16" placeholder="1234 5678 9012 3456" required>

        <label>Expiry Date</label>
        <input type="month" name="expiry" required>

        <label>CVV</label>
        <input type="password" name="cvv" maxlength="3" required>

        <button type="submit" class="pay-btn">Pay & Confirm Booking</button>
    </form>
    <p style="text-align:center;margin-top:15px;font-size:13px;color:#777;">
        * This is a demo payment. Card details are not stored.
    </p>
    <a href="{% url 'train:card_payment' booking.id %}" class="btn btn-success">Pay with Card </a>

</div>
{% endblock %}
</body>
</html>
